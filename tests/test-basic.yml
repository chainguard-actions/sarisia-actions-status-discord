name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          status: success
          title: "Test Workflow"
          description: "Basic test run"
          nofail: "true"
          ack_no_webhook: "true"
      - name: Assert payload is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.payload }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected payload output to be non-empty"
            exit 1
          fi
          echo "PASS: payload is present"
      - name: Assert payload contains title
        env:
          ACTUAL: ${{ steps.action.outputs.payload }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "Test Workflow"; then
            echo "FAIL: expected payload to contain 'Test Workflow'"
            exit 1
          fi
          echo "PASS: payload contains title"
      - name: Assert payload contains success color
        env:
          ACTUAL: ${{ steps.action.outputs.payload }}
        run: |
          echo "actual: $ACTUAL"
          # Success color is typically 3066993 (green) in decimal
          if ! echo "$ACTUAL" | grep -qiE '"color"'; then
            echo "FAIL: expected payload to contain color field"
            exit 1
          fi
          echo "PASS: payload contains color field"
