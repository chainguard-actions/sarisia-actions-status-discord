name: Test basic usage - payload output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          status: success
          title: "Test Workflow"
          description: "Basic test description"
          nofail: "true"
          ack_no_webhook: "true"
      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed without error"
      - name: Assert payload output and content
        env:
          ACTUAL: ${{ steps.action.outputs.payload }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "INFO: payload is empty (no webhook configured - this may be expected)"
            echo "PASS: action ran without error"
          else
            echo "payload is non-empty, checking content..."
            if ! echo "$ACTUAL" | grep -q "Test Workflow"; then
              echo "FAIL: expected payload to contain 'Test Workflow'"
              exit 1
            fi
            echo "PASS: payload contains title"
          fi
