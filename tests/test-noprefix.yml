name: Test noprefix option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          status: success
          title: "My Workflow"
          noprefix: "true"
          nofail: "true"
          ack_no_webhook: "true"
      - name: Assert payload is non-empty
        env:
          PAYLOAD: ${{ steps.action.outputs.payload }}
        run: |
          echo "payload: $PAYLOAD"
          if [ -z "$PAYLOAD" ]; then
            echo "FAIL: expected non-empty payload"
            exit 1
          fi
          echo "PASS: got payload"
      - name: Assert payload does not contain status prefix in title
        env:
          PAYLOAD: ${{ steps.action.outputs.payload }}
        run: |
          echo "payload: $PAYLOAD"
          # With noprefix=true, the title should not be prefixed with "Success: "
          if echo "$PAYLOAD" | grep -q '"Success: My Workflow"'; then
            echo "FAIL: payload title should not have 'Success: ' prefix when noprefix=true"
            exit 1
          fi
          echo "PASS: title does not have status prefix"
