name: Test nocontext and nodetail flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          status: success
          title: "Minimal Embed"
          nocontext: "true"
          nodetail: "true"
          notimestamp: "true"
          ack_no_webhook: "true"
      - name: Assert payload is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.payload }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected payload to be non-empty"
            exit 1
          fi
          echo "PASS: payload is present"
      - name: Assert payload contains title
        env:
          ACTUAL: ${{ steps.action.outputs.payload }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "Minimal Embed"; then
            echo "FAIL: expected payload to contain title 'Minimal Embed'"
            exit 1
          fi
          echo "PASS: payload contains title"
