name: Test custom options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          status: success
          title: "Custom Options Test"
          description: "Testing custom options"
          content: "Hello @everyone"
          color: "0x00FF00"
          username: "CI Bot"
          nocontext: "true"
          noprefix: "true"
          nodetail: "true"
          notimestamp: "true"
          nofail: "true"
          ack_no_webhook: "true"
      - name: Assert payload is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.payload }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected payload output to be non-empty"
            exit 1
          fi
          echo "PASS: payload is present"
      - name: Assert payload contains custom username
        env:
          ACTUAL: ${{ steps.action.outputs.payload }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "CI Bot"; then
            echo "FAIL: expected payload to contain username 'CI Bot'"
            exit 1
          fi
          echo "PASS: payload contains username"
      - name: Assert payload contains content
        env:
          ACTUAL: ${{ steps.action.outputs.payload }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "Hello @everyone"; then
            echo "FAIL: expected payload to contain content"
            exit 1
          fi
          echo "PASS: payload contains content"
      - name: Assert payload title has no status prefix (noprefix=true)
        env:
          ACTUAL: ${{ steps.action.outputs.payload }}
        run: |
          echo "actual: $ACTUAL"
          # When noprefix=true, the title should not start with "Success:" or "Failure:"
          if echo "$ACTUAL" | grep -qiE '"title"\s*:\s*"(Success|Failure|Cancelled):'; then
            echo "FAIL: expected title to have no status prefix"
            exit 1
          fi
          echo "PASS: title has no status prefix"
