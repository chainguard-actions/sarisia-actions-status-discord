name: Test failure status
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          status: failure
          title: "CI Build"
          ack_no_webhook: "true"
      - name: Assert payload is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.payload }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected payload to be non-empty for failure status"
            exit 1
          fi
          echo "PASS: payload is present for failure status"
      - name: Assert payload contains color field (failure color)
        env:
          ACTUAL: ${{ steps.action.outputs.payload }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q '"color"'; then
            echo "FAIL: expected payload to contain color field"
            exit 1
          fi
          echo "PASS: payload contains color field"
      - name: Assert payload contains title
        env:
          ACTUAL: ${{ steps.action.outputs.payload }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "CI Build"; then
            echo "FAIL: expected payload to contain title 'CI Build'"
            exit 1
          fi
          echo "PASS: payload contains title"
