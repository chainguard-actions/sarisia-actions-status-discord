name: Test failure status payload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          status: failure
          title: "FailureTest"
          description: "This is a failure notification"
          nofail: "true"
          ack_no_webhook: "true"
      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed without error"
      - name: Assert payload content for failure status
        env:
          ACTUAL: ${{ steps.action.outputs.payload }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "INFO: payload is empty (no webhook configured - this may be expected)"
            echo "PASS: action ran without error"
          else
            echo "payload is non-empty, checking content..."
            if ! echo "$ACTUAL" | grep -q "FailureTest"; then
              echo "FAIL: expected title 'FailureTest' in payload"
              exit 1
            fi
            echo "PASS: title found in payload"
            if ! echo "$ACTUAL" | grep -q "This is a failure notification"; then
              echo "FAIL: expected description in payload"
              exit 1
            fi
            echo "PASS: description found in payload"
          fi
