name: Test failure status notification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          status: failure
          title: "Failed Build"
          description: "Something went wrong"
          nofail: "true"
          ack_no_webhook: "true"
      - name: Assert payload is non-empty for failure status
        env:
          PAYLOAD: ${{ steps.action.outputs.payload }}
        run: |
          echo "payload: $PAYLOAD"
          if [ -z "$PAYLOAD" ]; then
            echo "FAIL: expected non-empty payload for failure status"
            exit 1
          fi
          echo "PASS: got payload for failure status"
      - name: Assert payload is valid JSON
        env:
          PAYLOAD: ${{ steps.action.outputs.payload }}
        run: |
          echo "$PAYLOAD" | python3 -m json.tool > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "FAIL: payload is not valid JSON"
            exit 1
          fi
          echo "PASS: payload is valid JSON"
