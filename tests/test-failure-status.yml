name: Test failure status
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          status: failure
          title: "Failed Build"
          description: "Something went wrong"
          nofail: "true"
          ack_no_webhook: "true"
      - name: Assert payload is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.payload }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected payload output to be non-empty"
            exit 1
          fi
          echo "PASS: payload is present"
      - name: Assert payload contains failure title
        env:
          ACTUAL: ${{ steps.action.outputs.payload }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "Failed Build"; then
            echo "FAIL: expected payload to contain 'Failed Build'"
            exit 1
          fi
          echo "PASS: payload contains title"
      - name: Assert payload contains description
        env:
          ACTUAL: ${{ steps.action.outputs.payload }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "Something went wrong"; then
            echo "FAIL: expected payload to contain description"
            exit 1
          fi
          echo "PASS: payload contains description"
