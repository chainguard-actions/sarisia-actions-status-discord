name: Test failure status
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          status: failure
          title: "Failed Build"
          description: "Something went wrong"
          nofail: "true"
          ack_no_webhook: "true"
      - name: Assert payload is produced for failure status
        env:
          PAYLOAD: ${{ steps.action.outputs.payload }}
        run: |
          echo "payload: $PAYLOAD"
          if [ -z "$PAYLOAD" ]; then
            echo "FAIL: expected payload output to be non-empty for failure status"
            exit 1
          fi
          echo "PASS: payload produced for failure status"
      - name: Assert payload contains failure title
        env:
          PAYLOAD: ${{ steps.action.outputs.payload }}
        run: |
          if ! echo "$PAYLOAD" | grep -q "Failed Build"; then
            echo "FAIL: payload does not contain the failure title"
            exit 1
          fi
          echo "PASS: payload contains failure title"
