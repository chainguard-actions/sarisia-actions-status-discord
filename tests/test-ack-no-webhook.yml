name: Test ack_no_webhook suppresses error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          status: success
          title: "No Webhook Test"
          nofail: "true"
          ack_no_webhook: "true"
        # No webhook set — action should not fail because ack_no_webhook=true
      - name: Assert step succeeded (action did not fail)
        run: |
          echo "PASS: action completed without failing the workflow"
      - name: Assert payload output exists
        env:
          ACTUAL: ${{ steps.action.outputs.payload }}
        run: |
          echo "actual: $ACTUAL"
          # Payload should still be generated even without a webhook
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected payload to be generated even without webhook"
            exit 1
          fi
          echo "PASS: payload generated without webhook"
