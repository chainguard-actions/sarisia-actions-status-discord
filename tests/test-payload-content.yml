name: Test payload content
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          status: success
          title: "My Custom Title"
          description: "Custom description text"
          nofail: "true"
          ack_no_webhook: "true"
          nocontext: "false"
          noprefix: "false"
      - name: Assert payload contains title
        env:
          PAYLOAD: ${{ steps.action.outputs.payload }}
        run: |
          echo "payload: $PAYLOAD"
          if [ -z "$PAYLOAD" ]; then
            echo "FAIL: payload is empty"
            exit 1
          fi
          if ! echo "$PAYLOAD" | grep -q "My Custom Title"; then
            echo "FAIL: payload does not contain the custom title"
            exit 1
          fi
          echo "PASS: payload contains custom title"
      - name: Assert payload contains description
        env:
          PAYLOAD: ${{ steps.action.outputs.payload }}
        run: |
          echo "payload: $PAYLOAD"
          if ! echo "$PAYLOAD" | grep -q "Custom description text"; then
            echo "FAIL: payload does not contain the description"
            exit 1
          fi
          echo "PASS: payload contains description"
