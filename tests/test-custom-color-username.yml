name: Test custom color and username
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          status: success
          title: "Custom Styled Notification"
          color: "16711680"
          username: "CI Bot"
          ack_no_webhook: "true"
      - name: Assert payload contains custom color
        env:
          ACTUAL: ${{ steps.action.outputs.payload }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected payload to be non-empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "16711680"; then
            echo "FAIL: expected payload to contain custom color 16711680"
            exit 1
          fi
          echo "PASS: payload contains custom color"
      - name: Assert payload contains custom username
        env:
          ACTUAL: ${{ steps.action.outputs.payload }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "CI Bot"; then
            echo "FAIL: expected payload to contain username 'CI Bot'"
            exit 1
          fi
          echo "PASS: payload contains custom username"
