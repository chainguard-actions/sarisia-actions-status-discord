name: Test cancelled status and overrides
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          status: cancelled
          title: "Cancelled Status Test"
          description: "This simulates a cancelled job notification"
          username: "CI Bot"
          avatar_url: "https://github.com/github.png"
          color: "0x808080"
          nofail: "true"
          ack_no_webhook: "true"
      - name: Assert payload output is non-empty
        env:
          PAYLOAD: ${{ steps.action.outputs.payload }}
        run: |
          echo "payload: $PAYLOAD"
          if [ -z "$PAYLOAD" ]; then
            echo "FAIL: expected payload output to be non-empty"
            exit 1
          fi
          echo "PASS: payload is present"
      - name: Assert payload contains custom username
        env:
          PAYLOAD: ${{ steps.action.outputs.payload }}
        run: |
          echo "payload: $PAYLOAD"
          if ! echo "$PAYLOAD" | grep -q "CI Bot"; then
            echo "FAIL: expected payload to contain custom username 'CI Bot'"
            exit 1
          fi
          echo "PASS: payload contains custom username"
